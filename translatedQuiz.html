<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hygge Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Madimi+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Quiz.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="nav-left">
        <button class="back-btn" onclick="window.location.href='translatedIndex.html';">
            <img src="Pictures/Back Btn.jpg" alt="Back">
        </button>
        </div>
        
        <a href="translatedIndex.html">
            <img src="Pictures/Logo.jpg" alt="Logo" class="logo">
        </a>
        
        <div class="nav-right">
            <a href="Quiz.html" class="globe-btn">
                <img src="Pictures/English.jpg" alt="Language">
            </a>
            <button class="menu-btn" onclick="toggleMenu()">
                <img src="Pictures/Hamburger Menu.jpg" alt="Menu">
            </button>
        </div>

        <!-- Hamburger Menu Overlay -->
        <div class="menu-overlay" id="menuOverlay">
            <button class="close-btn" onclick="toggleMenu()">×</button>
            <nav class="menu-content">
                <a href="translatedIndex.html">Home</a>
                <a href="translatedHygge.html">Hygge</a>
                <a href="translatedCreateAarhus.html">Create Aarhus</a>
                <a href="translatedDomen's.html">Domen's Coffee</a>
                <a href="translatedCreatingMemories.html">Create Moments</a>
                <a href="translatedQuiz.html">Quiz</a>
            </nav>
        </div>

    </header>

    <!-- Quiz Container -->
    <div class="quiz-container">
        <div class="progress" id="progress">1/5</div>
        
        <div class="question-card" id="questionCard">
            <img id="questionImage" class="question-image" src="" alt="Question image">
            <h2 class="question-text" id="questionText"></h2>
            
            <div class="options" id="optionsContainer"></div>
            
            <button class="next-btn" id="nextBtn" disabled>Next</button>
        </div>

        <!-- Result Card (hidden initially) -->
        <div class="result-card hidden" id="resultCard">
            <h2 class="result-title">Dit perfekte sted er...</h2>
            <div class="result-place" id="resultPlace"></div>
            <img id="resultImage" class="result-image" src="" alt="Result place">
            <p class="result-description" id="resultDescription"></p>
            <button class="restart-btn" onclick="restartQuiz()">Gentag Quiz</button>
        </div>
    </div>

   <!-- footer section -->
    <footer>
        <div class="footer-column">
            <h4>Hold kontakten:</h4>
            <p>Følg os på de sociale medier for daglig inspiration og opdateringer!</p>
        </div>
        <div class="footer-column">
            <h4>Få matches:</h4>
            <p>Hjælp folk med at finde det rette sted, når UX-kreativitet venter</p>
        </div>
    </footer>

    <script src="translatedQuiz.js"></script>
</body>
</html>
